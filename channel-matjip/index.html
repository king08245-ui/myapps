<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>채널 맛집수첩</title>
<meta name="description" content="내가 보는 유튜버들이 소개한 가게를 동네별·메뉴별로, 가까운 순으로 찾아보는 맛집 수첩">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151716" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="맛집수첩">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴은 화면을 막지 않게 따로 받는다(신호가 약해도 기본 글꼴로 먼저 그림) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" crossorigin media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" crossorigin></noscript>
<style>
/* Layout: one narrow column like a pocket notebook — sign-style header, mode switch + search, where-am-I, channel filter, then results as menu slips */
:root{
  --bg:#F3F4F1; --paper:#FFFFFF; --ink:#1C1F1D; --muted:#5F6661; --line:#DADDD7;
  --accent:#C8361C; --accent-ink:#FFFFFF; --soft:#F8E6E1;
  --c1:#C8361C; --c2:#2F6F9F; --c3:#2E7D4F; --c4:#8A5A00; --water:#A9CFEA; --waterink:#3F77A1;
  --gu0:#F1F2EE; --gu1:#E8EDE5; --gu2:#F3EEE4; --gu3:#E6EBEF; --gu-line:#9EA59F; --gu-ink:#454C47;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151716; --paper:#1E2120; --ink:#ECEEEA; --muted:#A3AAA5; --line:#323633;
  --accent:#F0644A; --accent-ink:#1A0D09; --soft:#3A1F19;
  --c1:#F0644A; --c2:#6FA8D6; --c3:#6FCB94; --c4:#E2B54A; --water:#24496A; --waterink:#7FB2DA;
  --gu0:#181B19; --gu1:#1C221E; --gu2:#221F19; --gu3:#1A1F23; --gu-line:#59615B; --gu-ink:#BEC5C0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151716; --paper:#1E2120; --ink:#ECEEEA; --muted:#A3AAA5; --line:#323633;
  --accent:#F0644A; --accent-ink:#1A0D09; --soft:#3A1F19;
  --c1:#F0644A; --c2:#6FA8D6; --c3:#6FCB94; --c4:#E2B54A; --water:#24496A; --waterink:#7FB2DA;
  --gu0:#181B19; --gu1:#1C221E; --gu2:#221F19; --gu3:#1A1F23; --gu-line:#59615B; --gu-ink:#BEC5C0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:20px 48px;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;min-height:100dvh}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sign{font-family:var(--f-display);font-size:34px;line-height:1;letter-spacing:.01em;margin:0;font-weight:400}
.sign span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.note{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted);margin:0}
section{display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.search{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;min-height:44px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.primary:disabled,button:disabled{opacity:.5;cursor:default}
.install{font-weight:700;white-space:nowrap;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;color:var(--ink)}
.chip.toggle[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.chip .sw{width:9px;height:9px;border-radius:50%;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.gps{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.gps.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.gps svg{width:16px;height:16px;flex:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);align-self:flex-start}
.seg button{border:0;border-radius:999px;padding:6px 18px;min-height:40px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-size:14px}
.results{display:flex;flex-direction:column;gap:10px}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slip h3{margin:0;font-size:17px;line-height:1.3;text-wrap:balance;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.desc{color:var(--accent);font-weight:500;font-size:14px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.links a{display:inline-flex;align-items:center;min-height:40px;font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.links a:hover{border-color:var(--ink)}
.group{font-family:var(--f-display);font-size:18px;margin:8px 0 0;font-weight:400}
.count{font-variant-numeric:tabular-nums}
.more{align-self:center}
.here{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.here strong{font-size:15px}
.here .muted{color:var(--muted);font-size:13px}
.dist{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.viewbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;font-size:17px;font-weight:700;border-radius:14px;
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgb(200 54 28 / .28);transition:transform .1s}
.viewbtn:hover{filter:brightness(1.06)}
.viewbtn:active{transform:scale(.98)}
.viewbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:none}
.viewbtn svg{width:20px;height:20px;flex:none}
@media (prefers-reduced-motion:reduce){.viewbtn{transition:none}}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.mapwrap svg{display:block;width:100%;height:min(60vh,560px);touch-action:none;cursor:grab;background:var(--paper)}
.mapwrap svg:active{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:44px;height:44px;padding:0;font-size:18px;font-weight:700;border-radius:10px;box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.mapctl button.wide{width:auto;padding:0 10px;font-size:13px}
.maplegend{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.maplegend span{display:inline-flex;align-items:center;gap:4px}
.maplegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mapnote{font-size:12px;color:var(--muted);margin:6px 0 0}
.gu{fill:var(--gu0);stroke:var(--gu-line);stroke-width:1.3;stroke-linejoin:round}
.gu.t1{fill:var(--gu1)}.gu.t2{fill:var(--gu2)}.gu.t3{fill:var(--gu3)}
.prov{fill:var(--bg);stroke:var(--line);stroke-width:1}
.gulabel{fill:var(--gu-ink);font-family:var(--f-body);font-weight:700;text-anchor:middle;letter-spacing:.02em;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round;stroke-opacity:.85}
.pin{stroke:var(--paper);stroke-width:1.5;cursor:pointer}
.pin.rough{fill-opacity:.35;stroke-dasharray:2 2}
.pin.sel{stroke:var(--ink);stroke-width:3}
.sellabel{pointer-events:none}
.sellabel rect,.sellabel path{fill:var(--ink)}
.sellabel text{fill:var(--paper);font-family:var(--f-body);font-weight:700}
.me{fill:var(--ink);stroke:var(--paper);stroke-width:2}
.ctr{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.melabel{fill:var(--ink);font-family:var(--f-body);font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.han{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.hanlabel{fill:var(--waterink);font-family:var(--f-body);font-weight:700;letter-spacing:.3em;pointer-events:none}
.stn{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.stnlabel{fill:var(--ink);font-family:var(--f-body);font-weight:700;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.gmap{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;margin-bottom:10px}
.gmap small{font-weight:400;color:var(--muted);font-size:12px}
.ring{fill:none;stroke:var(--accent);stroke-opacity:.45;stroke-dasharray:4 4}
.ringlabel{fill:var(--accent);font-family:var(--f-body);font-weight:700;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.foot p{margin:0}
.foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="sign">채널 <span>맛집</span>수첩</h1>
      <p class="sub">내가 보는 유튜버들이 영상에서 소개한 가게를 동네별로, 메뉴별로 찾아봐요</p>
    </div>
    <button type="button" class="install" id="installBtn" hidden>앱 설치</button>
  </header>
  <p class="note" id="iosHint" hidden>아이폰: 사파리 아래쪽 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요.</p>

  <section aria-labelledby="regionLabel">
    <div class="seg" role="group" aria-label="찾는 방식">
      <button type="button" id="modeArea" aria-pressed="true">동네로</button>
      <button type="button" id="modeMenu" aria-pressed="false">메뉴로</button>
    </div>
    <div class="label" id="regionLabel">어느 동네?</div>
    <form class="search" id="searchForm">
      <input type="text" id="q" placeholder="예: 종로3가, 성수동" autocomplete="off" aria-labelledby="regionLabel">
      <button class="primary" id="searchBtn" type="submit">찾기</button>
    </form>
    <div class="chips" id="quick"></div>
  </section>

  <section aria-labelledby="hereLabel">
    <div class="label" id="hereLabel">내 위치 (가까운 순 정렬)</div>
    <div class="here"><div><strong id="hereName">아직 정하지 않았어요</strong><div class="muted" id="hereHint">아래에서 고르면 결과가 가까운 순으로 바뀌어요</div></div>
      <button type="button" id="nearBtn" hidden>내 근처 전체 보기</button></div>
    <div class="chips" id="herePresets"></div>
    <form class="search" id="hereForm">
      <input type="text" id="hereInput" placeholder="역·동네 이름 (예: 합정역)" autocomplete="off" aria-label="위치 직접 입력">
      <button type="submit" id="hereBtn">위치 설정</button>
    </form>
  </section>

  <section aria-labelledby="chLabel">
    <div class="label" id="chLabel"><span>채널</span><span class="count" id="dbStat"></span></div>
    <div class="chips" id="channels"></div>
    <p class="hint">눌러서 검색에서 빼거나 넣을 수 있어요.</p>
  </section>

  <section aria-live="polite">
    <div class="label"><span id="resultTitle">결과</span><span id="resultNote" class="count"></span></div>
    <button type="button" class="viewbtn" id="viewBtn" hidden>지도로 보기</button>
    <div id="results" class="results"><div class="empty">데이터를 불러오는 중이에요…</div></div>
  </section>

  <footer class="foot">
    <p id="dataNote"></p>
    <p>새 채널이나 새 영상을 넣고 싶으면 Claude에게 채널 링크를 보내 주세요. · <a href="privacy.html">개인정보처리방침</a></p>
  </footer>
</div>

      const dx = (e.clientX - last[0]) / r.width * vb[2], dy = (e.clientY - last[1]) / r.height * vb[3];
      if (Math.abs(e.clientX - last[0]) + Math.abs(e.clientY - last[1]) > 2) moved = true;
      vb = [vb[0] - dx, vb[1] - dy, vb[2], vb[3]]; last = [e.clientX, e.clientY]; draw();
    });
    const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 1) last = [...ptrs.values()][0]; };
    svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
    svg.addEventListener("wheel", e => { e.preventDefault(); const [mx, my] = toMap(e.clientX, e.clientY); zoom(e.deltaY > 0 ? 1.25 : 0.8, mx, my); }, { passive: false });
    svg.addEventListener("click", () => { if (!moved && state.sel) { state.sel = null; card.replaceChildren(); draw(); } });

    fit.all = false; fit(pts.length ? pts : []); draw();
    if (state.sel && pts.some(q => q.p === state.sel)) showCard(state.sel);
  }

  function slip(p) {
    const V = state.db.videos, v = V[p.vs[0]] || {};
    const ref = state.lastCenter || state.origin;
    // map links search "address + name"; without an address, "area + name" so the map app looks in the right town
    const q = encodeURIComponent((p.a ? p.a.replace(/\s*\d+층.*$/, "") : (p.ar || (p.g && p.g[3]) || "")) + " " + p.n);
    const vid = "https://www.youtube.com/watch?v=" + v.id + (p.s ? "&t=" + p.s + "s" : "");
    return el("article", { class: "slip" },
      el("h3", {}, p.n,
        (state.mode === "menu" || ref) ? el("span", { class: "tag", style: `color:${chColor(p.c)}` }, p.c) : null,
        ref && p.km !== Infinity ? el("span", { class: "dist", title: p.rough ? "동네 기준 대략 거리" : "주소 기준 직선거리" },
          // a rough point is only the centre of its neighbourhood, so "약 0m" would claim too much
          p.rough && p.km < 1 ? (p.g[3] ? `${p.g[3]} 근처` : "약 1km 안")
            : (state.lastCenter ? `${ref.name}에서 ` : "") + (p.rough ? "약 " : "") + fmtKm(p.km)) : null),
      p.x ? el("div", { class: "desc" }, p.x) : null,
      el("div", { class: "meta" },
        p.a ? el("span", {}, "📍 " + p.a) : (p.ar ? el("span", {}, "📍 " + p.ar) : null),
        el("span", {}, "▶ " + (v.t || "") + (v.d ? " · " + v.d.slice(0, 7).replace("-", ".") : "") + (p.vs.length > 1 ? ` 외 ${p.vs.length - 1}편` : ""))),
      el("div", { class: "links" },
        el("a", { href: vid, target: "_blank", rel: "noopener" }, p.s ? "영상 그 장면" : "영상 보기"),
        el("a", { href: "https://map.naver.com/p/search/" + q, target: "_blank", rel: "noopener" }, "네이버지도"),
        el("a", { href: "https://map.kakao.com/?q=" + q, target: "_blank", rel: "noopener" }, "카카오맵"),
        el("a", { href: "https://www.google.com/maps/search/?api=1&query=" + q, target: "_blank", rel: "noopener" }, "구글지도")));
  }

  // <shops> ---------- one entry per shop ----------
  // A shop can appear in several videos of a channel, sometimes spelled a little differently ("행복식당" / "행복한식당")
  // or with its address written another way. Rows of one channel are joined when the names are alike AND the place
  // agrees, so two different shops that share a name (대박분식 in 서울 and in 부산) stay apart.
  const nameKey = s => norm(s).replace(/[^0-9a-z가-힣]/g, "");
  const PROV = /^(서울|부산|대구|인천|광주|대전|울산|세종)(특별시|광역시|특별자치시|시)?$/;
  function addrKey(a) {   // "서울시 중구 을지로 3길 30-14 2층" → { road: "을지로3길 30-14", dist: ["중구"] }
    const t = (a || "").replace(/\(.*?\)/g, " ").replace(/(로|길)\s+(\d+(?:번|가)?길)(?=\s|$)/g, "$1$2").split(/\s+/);
    let road = null;
    for (let i = 0; i + 1 < t.length; i++) if (/(로|길|가|동|리)$/.test(t[i]) && /^\d+(-\d+)?$/.test(t[i + 1])) road = t[i] + " " + t[i + 1];
    return road ? { road, dist: t.filter(x => /(구|군|시)$/.test(x) && !PROV.test(x)) } : null;
  }
  const sameTown = (a, b) => !a || !b || !a.dist.length || !b.dist.length || a.dist.some(x => b.dist.includes(x));
  function oneEdit(a, b, sub) {   // one letter added or dropped (or, with sub, changed) turns a into b
    if (a.length === b.length) {
      if (!sub) return false;
      let e = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i] && ++e > 1) return false;
      return e === 1;
    }
    if (Math.abs(a.length - b.length) !== 1) return false;
    const [s, l] = a.length < b.length ? [a, b] : [b, a];
    let i = 0; while (i < s.length && s[i] === l[i]) i++;
    return s.slice(i) === l.slice(i + 1);
  }
  // names alike: equal, one inside the other ("함덕 골목해장국" / "골목해장국"), one letter added ("행복식당" / "행복한식당"),
  // and at the very same address also one letter changed in a longer name ("로바다아키" / "로바타아키")
  function alike(a, b, sameAddr) {
    if (a === b) return true;
    const s = Math.min(a.length, b.length);
    if (s < (sameAddr ? 3 : 4)) return false;
    return a.includes(b) || b.includes(a) || oneEdit(a, b, sameAddr && s >= 5);
  }
  // how far off a point may be: a guess from a city name ~30km, a Seoul district ~8km, a neighbourhood ~4km,
  // an address point ~1–2km
  const REACH = new Map(AREAS.map(([n], i) => [n, i < GU_END ? 8 : i >= CITY_START ? 30 : 4]));
  const reach = p => !p.g ? Infinity : p.g[3] ? (REACH.get(p.g[3]) || 4) : p.g[2] === 3 ? 2 : 1;
  function buildShops(places, videos, perVideo) {
    const up = places.map((_, i) => i);
    const find = i => { while (up[i] !== i) i = up[i] = up[up[i]]; return i; };
    const join = (i, j) => { i = find(i); j = find(j); if (i !== j) up[j] = i; };
    const nk = places.map(p => nameKey(p.n)), ak = places.map(p => p.a ? addrKey(p.a) : null);
    const gap = (p, q) => p.g && q.g ? dist(p.g[0], p.g[1], q.g[0], q.g[1]) : null;
    const chans = new Map();
    places.forEach((p, i) => { if (!chans.has(p.c)) chans.set(p.c, []); chans.get(p.c).push(i); });
    for (const idx of chans.values()) {
      const withA = idx.filter(i => places[i].a), noA = idx.filter(i => !places[i].a);
      // 1) shops with an address: the same address, or address points within 1km of each other, and alike names
      //    (compared only within one address / neighbouring 1km squares, so this stays quick on a phone)
      const byRoad = new Map(), cells = new Map(), put = (m, k, i) => { if (!m.has(k)) m.set(k, []); m.get(k).push(i); };
      for (const i of withA) {
        const p = places[i];
        if (ak[i]) put(byRoad, ak[i].road, i);
        if (p.geo) put(cells, Math.floor(p.g[0] / 0.01) + "," + Math.floor(p.g[1] / 0.013), i);
      }
      const sameAddr = (i, j) => ak[i] && ak[j] && ak[i].road === ak[j].road && sameTown(ak[i], ak[j]);
      for (const rows of byRoad.values()) for (let x = 0; x < rows.length; x++) for (let y = x + 1; y < rows.length; y++)
        if (sameAddr(rows[x], rows[y]) && alike(nk[rows[x]], nk[rows[y]], true)) join(rows[x], rows[y]);
      for (const [key, rows] of cells) {
        const [a, b] = key.split(",").map(Number);
        for (let da = -1; da <= 1; da++) for (let db = -1; db <= 1; db++) for (const j of cells.get((a + da) + "," + (b + db)) || [])
          for (const i of rows) {
            if (j <= i || sameAddr(i, j) || !sameTown(ak[i], ak[j])) continue;
            const p = places[i], q = places[j], d = gap(p, q);
            // two rough (neighbourhood-level) points say little: then the name must be the same and the points close
            if (p.g[2] === 3 && q.g[2] === 3 ? nk[i] === nk[j] && d <= 0.5 : alike(nk[i], nk[j], false) && d <= 1) join(i, j);
          }
      }
      // 2) a row without an address joins the nearest shop of the very same name that its rough point can reach;
      //    with no point at all, only when there is just one such shop
      const loose = new Map(), byName = new Map();   // loose: name → rows not placed yet
      withA.forEach(i => put(byName, nk[i], i));
      for (const i of noA) {
        const p = places[i], same = byName.get(nk[i]) || [];
        let to = null;
        if (p.g) { let bd = Infinity; same.forEach(j => { const d = gap(p, places[j]); if (d != null && d <= reach(p) + reach(places[j]) && d < bd) { bd = d; to = j; } }); }
        else if (same.length && new Set(same.map(find)).size === 1) to = same[0];
        if (to != null) join(to, i);
        else put(loose, nk[i], i);
      }
      // 3) the rest, by name: rows whose rough points agree are one shop ("맛있는집" in 서대문구 and in 영등포 are two);
      //    rows with no point join them only when that leaves no doubt (a single shop of that name)
      for (const rows of loose.values()) {
        const at = rows.filter(i => places[i].g), none = rows.filter(i => !places[i].g);
        for (let x = 0; x < at.length; x++) for (let y = x + 1; y < at.length; y++) {
          const p = places[at[x]], q = places[at[y]];
          if (gap(p, q) <= Math.min(reach(p), reach(q))) join(at[x], at[y]);
        }
        if (new Set(at.map(find)).size <= 1) none.forEach(i => join(at.length ? at[0] : none[0], i));
      }
    }
    const groups = new Map();
    places.forEach((p, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(p); });
    return [...groups.values()].map(rows => makeShop(rows, videos, perVideo));
  }
  function makeShop(rows, videos, perVideo) {
    // its point: an address point beats a guess from the area name; then the most precise; then the one most rows
    // agree on; then the most detailed address
    const geo = rows.filter(p => p.geo);
    const agree = p => p.geo ? geo.filter(q => dist(p.g[0], p.g[1], q.g[0], q.g[1]) <= 0.3).length : 0;
    const best = rows.slice().sort((p, q) => (q.geo - p.geo) || ((p.g ? p.g[2] : 9) - (q.g ? q.g[2] : 9))
      || (agree(q) - agree(p)) || ((q.a || "").length - (p.a || "").length) || ((q.ar ? 1 : 0) - (p.ar ? 1 : 0)))[0];
    const count = new Map(); rows.forEach(p => count.set(p.n, (count.get(p.n) || 0) + 1));
    const n = [...count].sort((a, b) => b[1] - a[1] || b[0].length - a[0].length)[0][0];   // the usual spelling
    const vs = [...new Set([best.v, ...rows.map(p => p.v)])];
    const shop = { n, c: best.c, v: best.v, s: best.s, vs, g: best.g, geo: best.geo, a: best.a || "",
      x: best.x || rows.map(p => p.x).find(Boolean) || "", ar: best.ar || rows.map(p => p.ar).find(Boolean) || "",
      d: vs.reduce((m, v) => (videos[v]?.d || "") > m ? videos[v].d : m, ""), rows: rows.length };
    shop.rough = !shop.g || shop.g[2] === 3;
    shop.tka = [...new Set(rows.flatMap(p => p.tka))];   // words of its addresses and area notes
    shop.tk = [...new Set(rows.flatMap(p => p.tk))];     // ...plus video titles and descriptions
    // what a menu search reads: names, descriptions, and the titles of videos about this one shop (see match)
    shop.hay = rows.map(p => norm(p.n) + "|" + norm(p.x) + "|" + (perVideo[p.v] === 1 ? norm(videos[p.v]?.t) : "")).join("|");
    shop.lists = [...new Set(rows.map(p => norm(videos[p.v]?.t)).filter(t => LIST_MARK.test(t)))];
    return shop;
  }
  // </shops>

  // ---------- boot ----------
  $("searchForm").addEventListener("submit", e => { e.preventDefault(); search($("q").value); });
  $("modeArea").addEventListener("click", () => setMode("area"));
  $("modeMenu").addEventListener("click", () => setMode("menu"));
  $("hereForm").addEventListener("submit", e => { e.preventDefault(); lookupOrigin($("hereInput").value); });
  $("nearBtn").addEventListener("click", () => nearby());
  $("viewBtn").addEventListener("click", () => {
    state.view = state.view === "map" ? "list" : "map"; state.sel = null;
    try { localStorage.setItem("cfn.view", state.view); } catch {}
    if (state.lastRows) renderResults(state.lastTerm, state.lastRows, state.lastNote, state.lastCenter);
  });
  try { if (localStorage.getItem("cfn.view") === "map") state.view = "map"; } catch {}
  renderQuick(); renderHere();
  // a saved "현재 위치" is from last time: refresh it quietly when the phone already allows location
  if (state.origin?.gps && navigator.permissions?.query) navigator.permissions.query({ name: "geolocation" }).then(s => { if (s.state === "granted") useGPS(true); }).catch(() => {});

  fetch("places.json").then(r => r.json()).then(raw => {
    const videos = raw.videos.map(([id, t, d, c]) => ({ id, t, d, c }));
    const places = raw.places.map(([n, x, a, ar, v, s, g]) => {
      const p = { n, x, a, ar, v, s, c: videos[v]?.c || "" };
      p.geo = Array.isArray(g);
      p.g = p.geo ? g : roughPoint(p, videos[v]);
      p.tka = toks((a || "") + " " + (ar || ""));                            // words of the address and area note
      p.tk = p.tka.concat(toks((videos[v]?.t || "") + " " + (x || "")));    // ...plus the video title and description
      return p;
    });
    const perVideo = {};
    places.forEach(p => { perVideo[p.v] = (perVideo[p.v] || 0) + 1; });
    const shops = buildShops(places, videos, perVideo);
    state.db = { channels: raw.channels.map(name => ({ name })), videos, places, shops, perVideo };
    renderChannels();
    const newest = videos.reduce((m, v) => v.d > m ? v.d : m, "");
    const precise = shops.filter(p => p.geo && p.g[2] <= 2).length, none = shops.filter(p => !p.g).length;
    $("dataNote").textContent = `${newest.replace(/-/g, ".")}까지 올라온 영상 기준 · 가게 ${shops.length}곳 중 ${precise}곳은 주소로 찍은 위치, `
      + `${shops.length - precise - none}곳은 동네 기준 대략 위치` + (none ? `, ${none}곳은 위치 정보 없음` : "");
    showIntro();
  }).catch(() => $("results").replaceChildren(el("div", { class: "empty" }, "가게 데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.")));

  // ---------- install as an app ----------
  let deferredPrompt;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; $("installBtn").hidden = false; });
  $("installBtn").addEventListener("click", async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $("installBtn").hidden = true; });
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $("iosHint").hidden = false;
  if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname)))
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
