<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>역산 15분 플래너</title>
<meta name="description" content="목표에서 거꾸로 중간 목표를 세우고, 15분 단위 할 일로 쪼개 날짜별로 배치하는 플래너">
<meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="역산플래너">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-hand phone planner on graph paper — goal header, view, fixed bottom tabs. In 역산, time runs upward: the final goal sits on top, today at the bottom. */
:root{
  --paper:#eef0f6; --card:#ffffff; --ink:#181b26; --muted:#565d70; --line:#d7dbe6; --rule:rgba(58,62,178,.07);
  --accent:#3a3eb2; --on-accent:#ffffff; --accent-soft:#e6e7fa;
  --sun:#e09a00; --sun-soft:#fff2cf; --sun-ink:#5a3d00;
  --done:#127a5f; --on-done:#ffffff; --warn:#a8401a; --warn-soft:#fcebe3;
  --h1:58 62 178; --h2:12 128 128; --h3:191 120 0; --h4:177 62 102; --h5:74 120 34; --h6:110 78 180; --accent-rgb:58 62 178;
  --f-display:"Hahmlet","Apple SD Gothic Neo","Noto Serif KR",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11131a; --card:#1a1d28; --ink:#e9ebf3; --muted:#a3a9bb; --line:#2c3142; --rule:rgba(157,162,255,.06);
  --accent:#a3a8ff; --on-accent:#121433; --accent-soft:#25284a;
  --sun:#ffc23d; --sun-soft:#3a2f12; --sun-ink:#ffe2a0;
  --done:#3ccf9f; --on-done:#08251c; --warn:#ff9466; --warn-soft:#3b2017;
  --h1:163 168 255; --h2:72 205 200; --h3:255 194 61; --h4:245 128 168; --h5:156 210 96; --h6:196 160 255; --accent-rgb:163 168 255;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11131a; --card:#1a1d28; --ink:#e9ebf3; --muted:#a3a9bb; --line:#2c3142; --rule:rgba(157,162,255,.06);
  --accent:#a3a8ff; --on-accent:#121433; --accent-soft:#25284a;
  --sun:#ffc23d; --sun-soft:#3a2f12; --sun-ink:#ffe2a0;
  --done:#3ccf9f; --on-done:#08251c; --warn:#ff9466; --warn-soft:#3b2017;
  --h1:163 168 255; --h2:72 205 200; --h3:255 194 61; --h4:245 128 168; --h5:156 210 96; --h6:196 160 255; --accent-rgb:163 168 255;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:24px 24px;
  color:var(--ink);font:16px/1.55 var(--f-body);word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(84px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* 머리글 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font:800 15px/1 var(--f-display);letter-spacing:-.2px;color:var(--accent);white-space:nowrap}
.goalpick{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 10px}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-done);font-weight:700}
.icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:20px;line-height:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:12px}
main{padding-block:16px}
h2.view-title{font:800 22px/1.25 var(--f-display);margin:4px 0 12px;text-wrap:balance}
.label{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}
.small-text{font-size:14px}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;vertical-align:2px}
.tag.mk{background:var(--sun-soft);color:var(--sun-ink)}
.tag.off{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

/* 오늘 */
.hero h1{font:800 24px/1.3 var(--f-display);margin:2px 0 6px;text-wrap:balance}
.dday{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
/* D-day: 지났거나 오늘(빨강) · 7일 안(주황) · 그 밖(파랑) — 크게 */
.dd{display:inline-flex;align-items:center;font:700 15px/1 var(--f-num);letter-spacing:-.3px;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;flex:none}
.dd.soon{background:var(--sun-soft);color:var(--sun-ink);box-shadow:inset 0 0 0 1.5px var(--sun)}
.dd.over,.dd.today{background:var(--warn);color:var(--card)}
.dd.big{font-size:22px;padding:6px 12px}
/* 요일별 시간 한 줄(월~일) */
.wk{display:inline-flex;gap:2px;flex:none}
.wk i{display:inline-grid;justify-items:center;width:27px;padding:3px 0 2px;border-radius:7px;background:var(--paper);font-style:normal;line-height:1.15}
.wk i span{font-size:11px;font-weight:700;color:var(--muted)}
.wk i small{font:600 11px/1.15 var(--f-num);color:var(--muted)}
.wk i.on{background:var(--accent-soft)}
.wk i.on small{color:var(--accent)}
.wk i.now{box-shadow:inset 0 0 0 1.5px var(--sun)}
.wkrow{display:flex;align-items:center;gap:0 6px;flex-wrap:wrap;margin-top:6px}
.wkline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 0;min-height:44px;text-align:left;color:var(--ink)}
.wkline .nm{display:flex;align-items:center;gap:6px;min-width:0}
.wkline .nm b{font:800 14.5px/1.3 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 시간 고르기 드롭다운 */
.tsel{min-height:44px;min-width:104px;max-width:100%;font-family:var(--f-body);font-size:16px;font-weight:600;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);margin:12px 0 6px}
.prog b{color:var(--ink)}
.mosaic{display:flex;flex-wrap:wrap;gap:3px}
.mosaic i{width:10px;height:10px;border-radius:2px;background:rgb(var(--hue) / .16);box-shadow:inset 0 0 0 1px rgb(var(--hue) / .55)}
.mosaic i.d{background:rgb(var(--hue));box-shadow:none}
.mosaic i.t{box-shadow:0 0 0 2px var(--sun)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;background:rgb(var(--hue))}
.banner{background:var(--sun-soft);color:var(--sun-ink);border-radius:14px;padding:12px 14px;font-size:14px;display:grid;gap:8px}
.banner .btn{justify-self:start}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;display:grid;gap:8px}
.alert b{color:inherit}
.alert .btn{justify-self:start}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 8px}
.today-head h2{font:800 19px/1.3 var(--f-display);margin:0}
.blocks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
/* 15분 칸: 폰 한 화면에 많이 보이게 한 줄씩 낮게(체크 40px) */
.blk{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px;border-left:5px solid rgb(var(--hue))}
.blk .chk{width:40px;height:40px;border-radius:10px;border:2px solid rgb(var(--hue));background:transparent;display:flex;align-items:center;justify-content:center}
.blk .chk svg{width:20px;height:20px;opacity:0}
.blk.done .chk{background:rgb(var(--hue))}
.blk.done .chk svg{opacity:1;color:var(--card)}
.blk.done .t1{text-decoration:line-through;color:var(--muted)}
.blk .t1{font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t2{font-size:12px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .play{width:44px;min-width:44px;padding:0;font-size:15px}
.empty{text-align:center;padding:20px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:800 18px/1.35 var(--f-display);margin-bottom:6px}
.goalsec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 6px 6px;margin-top:8px}
.goalsec .gh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:2px 2px 4px;text-align:left;min-height:40px;color:var(--ink)}
.goalsec .gh b{font:800 16px/1.3 var(--f-display);min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goalsec .gh .num{color:var(--muted);font-size:13px;white-space:nowrap}
.goalsec .blk{border-top-color:var(--line)}
.rest{font-size:13.5px;color:var(--muted);margin:12px 2px 0;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
.mlist{margin-bottom:8px}
.mrow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px 8px;align-items:center;background:var(--sun-soft);color:var(--sun-ink);border:1.5px dashed var(--sun);border-radius:14px;padding:10px 12px}
.mrow .tri{color:rgb(var(--hue));font-size:17px;line-height:1;text-align:center}
.mrow .t1{font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.mrow .due{display:inline-block;font-size:12px;font-weight:800;line-height:1.5;border:1.5px solid var(--sun);background:var(--card);color:var(--sun-ink);border-radius:999px;padding:0 8px;margin-right:2px;vertical-align:1px}
.mrow .t2{font-size:13px;margin-top:2px}
.mrow .acts{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.dfoot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:8px 2px 0;font-size:13.5px;color:var(--muted)}
.dfoot p{margin:0 0 2px;flex-basis:100%}
.syncline{display:flex;flex-wrap:wrap;gap:0 8px;align-items:center;margin:18px 2px 0;font-size:13px;color:var(--muted)}
.syncline.err{color:var(--warn)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:8px 4px;min-height:40px;text-decoration:underline;text-underline-offset:3px;font-size:13.5px}

/* 타이머 */
.timer{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:18px;padding:14px;margin-top:16px}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .25s linear}
.ring .left{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 26px/1 var(--f-num);color:var(--ink)}
.ring .left.long{font-size:20px}
.timer .what{font-weight:700;line-height:1.35}
.timer .who{font-size:13px;color:var(--muted)}
.timer .row{margin-top:8px}
.timer.end{border-color:var(--sun);background:var(--sun-soft)}
.timer.end .what{color:var(--sun-ink)}
@media (max-width:360px){.timer{grid-template-columns:1fr;justify-items:center;text-align:center}.timer .row{justify-content:center}}

/* 역산 */
.chain{position:relative;display:grid;gap:0}
.node{position:relative;padding-left:26px}
.node::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.node .dot{position:absolute;left:1px;top:18px;width:16px;height:16px;border-radius:50%;background:rgb(var(--hue));border:3px solid var(--paper)}
.node.goal .dot{width:20px;height:20px;left:-1px;background:var(--accent)}
.node.goal::before{top:24px}
.node.now::before{bottom:auto;height:18px}
.node.now .dot{background:var(--card);box-shadow:inset 0 0 0 3px var(--muted)}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:6px 0;border-top:4px solid rgb(var(--hue))}
.node.goal .step{border-top-color:var(--accent);box-shadow:0 1px 0 var(--line)}
.step.closed{background:color-mix(in srgb,var(--card) 70%,var(--paper))}
.step.closed .step-title-text{text-decoration:line-through;color:var(--muted)}
.step-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.step-head .label{white-space:nowrap}
.step-titlerow{display:flex;gap:6px;align-items:flex-start}
.step-title{flex:1;min-width:0;width:100%;border:1px solid transparent;border-radius:10px;background:transparent;font:700 17px/1.35 var(--f-body);padding:6px;margin:4px 0 2px;resize:none;overflow:hidden;display:block}
.node.goal .step-title{font:800 19px/1.3 var(--f-display)}
.step-title:hover,.step-title:focus{border-color:var(--line);background:var(--paper)}
.step-title-text{flex:1;min-width:0;font:700 17px/1.35 var(--f-body);margin:6px 6px 2px}
.node.goal .step-title-text{font:800 19px/1.3 var(--f-display)}
.date-in{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 8px;font-family:var(--f-num)}
.date-txt{font:600 14px/1 var(--f-num);color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.chip.ok{color:var(--done);border-color:var(--done)}
.chip.no{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.tasks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.task{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 8px;align-items:center;padding:8px;border-radius:12px;background:var(--paper)}
.task input.tt{border:1px solid transparent;border-radius:8px;background:transparent;padding:6px;min-width:0;width:100%;font-weight:600;min-height:40px}
.task input.tt:focus{border-color:var(--line);background:var(--card)}
.task .sq{display:flex;flex-wrap:wrap;gap:3px;padding-left:6px;min-width:0}
.task .sq i{width:9px;height:9px;border-radius:2px;background:rgb(var(--hue) / .16);box-shadow:inset 0 0 0 1px rgb(var(--hue) / .55)}
.task .sq i.d{background:rgb(var(--hue));box-shadow:none}
.task .ctl{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:nowrap}
@media (min-width:430px){.task{grid-template-columns:minmax(0,1fr) auto}.task input.tt{grid-column:1/-1}}
.addtask{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:8px}
.addtask input{grid-column:1/-1;min-height:44px;border:1px dashed var(--line);border-radius:12px;background:var(--card);padding:0 10px;min-width:0}
.insert{display:flex;align-items:center;gap:8px;min-height:44px;margin:4px 0;padding:0 12px;border:1.5px dashed var(--accent);border-radius:12px;background:transparent;color:var(--accent);font-weight:700;font-size:14px;width:100%;text-align:left}
.insert b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);align-items:center;justify-content:center;font-size:16px;line-height:1;flex:none}
.now-card{padding:10px 0 4px;font-size:14px;color:var(--muted)}
.now-card b{color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.linknote{background:var(--sun-soft);color:var(--sun-ink);border-radius:14px;padding:12px 14px;font-size:14px;display:grid;gap:8px;margin-bottom:12px}
.linknote .btn{justify-self:start}
ul.daily{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
ul.daily li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:4px 4px 4px 12px;font-size:14px;flex-wrap:wrap}
.chooser{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chooser button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:56px}
.chooser button b{font:800 16px/1.3 var(--f-display)}

/* 일정 */
.avail{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.avail .a{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--paper);border-radius:12px;padding:2px 2px 2px 12px}
.avail .a.now{box-shadow:inset 0 0 0 2px var(--sun)}
.avail .a .wdn{font-weight:700}
.avail .a.we .wdn{color:var(--warn)}
.days{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.day.is-today{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun)}
.day .dh{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.day .dh b{font-family:var(--f-num);font-size:15px}
.day ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.day li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.day li i{width:9px;height:9px;border-radius:2px;background:rgb(var(--hue));flex:none;transform:translateY(-1px)}
.day li .n{margin-left:auto;font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.day li .who{color:var(--muted);font-size:12.5px;white-space:nowrap}
.mile{display:flex;gap:2px 10px;align-items:center;flex-wrap:wrap;font-size:13.5px;font-weight:700;color:var(--accent);padding:2px 4px}
.mile .linkish{font-size:13px;min-height:40px}
.day .dmiles{margin-top:6px;padding-top:4px;border-top:1px dashed var(--line);display:grid;gap:0}
.day .dh + .dmiles{border-top:0;padding-top:0}
.day .mile{padding:2px 0}
.mile.miss{color:var(--warn)}

/* 목표 */

/* 아래 탭 */

.tabs button[aria-current="page"]{color:var(--accent)}

/* 시트(마법사·창) */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}

.field label{font-size:14px;font-weight:700}
.field input,.field textarea{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;width:100%}
.field textarea{min-height:120px;resize:vertical;font-size:14px;line-height:1.5}

.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 4px}
.sum{background:var(--paper);border-radius:14px;padding:12px;font-size:15px;line-height:1.6}
.sum.bad{background:var(--warn-soft);color:var(--warn)}

.fgap{height:34px}
.fgap .fl{position:relative;display:flex;justify-content:center}
.fgap .ar{position:relative;width:2px;height:100%;background:var(--muted);opacity:.75}

.fgap .days{position:absolute;left:calc(50% + 10px);top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
/* 10/23: 밀린 것 · 일별·운동 회차 · 설정 전 · 완료 보관함 · 마법사 방식 고르기 */
.blk.late{background:color-mix(in srgb,var(--warn-soft) 60%,var(--card))}

.mosaic i.l{background:var(--warn-soft);box-shadow:inset 0 0 0 1.5px var(--warn)}
.rampinfo{display:grid;gap:4px;margin-top:6px}
.spark{width:100%;max-width:320px;height:64px;display:block}
.spark .sp-all{stroke:rgb(var(--accent-rgb) / .35);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.kinds{display:grid;gap:8px}
.kindc{display:grid;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px;color:var(--ink)}

.flabel{font-size:14px;font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.field .row input{flex:1 1 auto;min-width:0;width:auto}
.sesl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.sesl li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto 44px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1px 1px 1px 10px;min-height:46px;font-size:14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ---------- 바탕 ---------- */
const KEY = 'backplan:v1';
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const svgCheck = () => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'; return s; };

/* 날짜: 모두 한국 시간 YYYY-MM-DD 글자로 다룬다 */
const today = () => new Date().toLocaleDateString('sv-SE', {timeZone: 'Asia/Seoul'});
const dn = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
const ds = n => new Date(n * 864e5).toISOString().slice(0, 10);
const add = (s, k) => ds(dn(s) + k);
const diff = (a, b) => dn(b) - dn(a);
const wd = s => new Date(dn(s) * 864e5).getUTCDay();
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
const mdw = s => `${md(s)}(${WD[wd(s)]})`;
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(dn(s));
const dur = m => m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ' ' + (m % 60) + '분' : ''}`;
const dday = s => { const k = diff(today(), s); return k > 0 ? `D-${k}` : k === 0 ? 'D-DAY' : `D+${-k}`; };
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const HUES = ['--h1', '--h2', '--h3', '--h4', '--h5', '--h6'];
const sigOf = o => { const s = JSON.stringify(o); let x = 0; for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + x; };
const fmtWhen = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const day = d.toLocaleDateString('sv-SE', {timeZone: 'Asia/Seoul'}); const hm = d.toLocaleTimeString('ko-KR', {timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false}); return day === today() ? hm : `${md(day)} ${hm}`; };

/* ---------- 저장: 불러올 때 모양을 고쳐서 쓴다(깨진 백업·옛 저장본도 화면이 비지 않게) ---------- */
// 요일별 시간(일~토, 분) = 그 요일 오늘 화면 15분 칸 수이자 할 일을 놓을 수 있는 시간. 목표까지 목표는 매일 15분(10/20 '매일 15분'을 그대로)
const DEF_AVAIL = [120, 60, 60, 60, 60, 60, 120], LINK_AVAIL = [15, 15, 15, 15, 15, 15, 15], OLD_LINK_AVAIL = [0, 15, 15, 15, 15, 15, 0], DAILY15 = [15, 15, 15, 15, 15, 15, 15];
// 일별·운동 회차를 하는 요일(일~토). 기본 월~금 = 한 달 20일
const DEF_DAYS = [false, true, true, true, true, true, false];
function normStep(s, deadline) {
  if (!s || typeof s !== 'object') return null;
  const title = String(s.title ?? '').trim().slice(0, 120);
  if (!title && !s.final) return null;
  const tasks = [];
  for (const k of Array.isArray(s.tasks) ? s.tasks : []) {
    if (!k || typeof k !== 'object') continue;
    const t = String(k.title ?? '').trim().slice(0, 120); if (!t) continue;
    tasks.push({id: String(k.id || uid()).slice(0, 40), title: t, blocks: clamp(Math.round(+k.blocks) || 1, 1, 32)});
  }
  const out = {id: String(s.id || uid()).slice(0, 40), title: title || '최종 목표', due: isDate(s.due) ? s.due : deadline, tasks};
  if (s.final) out.final = true;

      const it = perItem.get(e.i) || {n: e.n, c: 0, last: e.d, m: e.m, s: e.s}; it.c++; if (e.d > it.last) it.last = e.d; it.n = Math.max(it.n, e.n); perItem.set(e.i, it);
    }
    for (const it of perItem.values()) if (it.c >= it.n) { const ym = it.last.slice(0, 7), c = p.sessions[it.m] = p.sessions[it.m] || {}; c[ym] = (c[ym] || 0) + 1; }
    if (g.mkEdit) {   // 폰에서 바꾼 날짜(목표까지가 받아 반영)
      const ed = {}; if (g.mkEdit.due) ed.due = g.mkEdit.due.to;
      if (g.mkEdit.steps) { ed.steps = {}; for (const [sid, x] of Object.entries(g.mkEdit.steps)) ed.steps[sid] = x.to; }
      p.edits = ed;
    }
    out.goals[g.src] = p;
  }
  // 폰에서 세우고 '목표까지에도 넣기'를 켠 목표 — 목표까지가 받아 인생 목표로 만들고 pid를 붙여 돌려준다
  const ng = state.goals.filter(g => !g.src && !g.sample && g.toMk === true);
  if (ng.length) out.newGoals = ng.map(g => ({pid: g.id, title: g.title, cat: MK_CATS.includes(g.cat) ? g.cat : '기타', start: g.createdAt, due: g.deadline, memo: g.why || '',
    steps: sortSteps(g).filter(s => !s.final).map(s => ({pid: s.id, t: s.title, due: s.due, done: !!s.done}))}));
  return out;
}
async function syncNow(why) {
  if (!syncReady()) return;
  if (syncing) return syncing;
  syncing = (async () => {
    state.sync.err = null; paintSync();
    let changed = false;
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const r = await api('GET', '/api/sync');
        const mine = state.sync.sig !== localSig() && state.goals.some(g => !g.sample);   // 아직 안 올린 내 변경
        if (r.rev > state.sync.rev && r.data) { mergeRemote(r.data, mine); changed = true; if (!mine) state.sync.sig = localSig(); }
        if (r.mk && r.mk.at && r.mk.at !== state.mk?.at) {
          applyMk(r.mk); changed = true;
          const n = mkNote; if (n.attached || n.conflicts) toast([n.attached ? `새 목표 ${n.attached}개가 목표까지에 들어갔어요` : '', n.conflicts ? `목표까지에서 따로 바꾼 날짜 ${n.conflicts}개는 목표까지를 따랐어요` : ''].filter(Boolean).join(' · '));
        }
        if (changed) fixCurrent();
        const need = state.sync.sig !== localSig() || r.rev < state.sync.rev;   // 내 변경이 있거나, 서버가 비워졌으면 올린다
        if (!need) { state.sync.rev = r.rev; break; }
        try {
          const res = await api('PUT', '/api/sync', {baseRev: r.rev, data: syncData(), progress: computeProgress(), device: DEVICE});
          state.sync.rev = res.rev; state.sync.sig = localSig(); break;
        } catch (e) { if (e.status === 409 && attempt < 2) { state.sync.rev = Math.min(state.sync.rev, r.rev); continue; } throw e; }
      }
      state.sync.at = new Date().toISOString();
    } catch (e) {
      state.sync.err = e.status === 401 ? '접속 코드가 맞지 않아요. 목표 화면에서 다시 넣어 주세요.'
        : e.status === 503 || e.status === 500 ? e.message
        : (e.name === 'AbortError' || e instanceof TypeError) ? '동기화 서버에 연결하지 못했어요. 인터넷이나 서버 주소를 확인하세요.' : e.message;
    } finally {
      syncing = null; save();
      if (changed) softRender(); else paintSync();
    }
  })();
  return syncing;
}
addEventListener('online', () => { if (syncReady()) syncNow('online'); });
setInterval(() => { if (syncReady() && document.visibilityState === 'visible') syncNow('poll'); }, 120e3);
// 설정 링크: …/backplan/#server=주소&code=코드 로 열면 저장한다.
// 주소창에는 서버 주소만 남긴다(코드는 절대 안 남김) — 이 페이지 주소를 다른 기기로 보내면 그쪽도 서버 칸이 채워진다.
function setLinkHash(server) {
  try { history.replaceState(null, '', location.pathname + location.search + (server ? '#server=' + encodeURIComponent(server) : '')); } catch {}
}
function linkFor(server) { return location.origin + location.pathname + '#server=' + encodeURIComponent(server); }
function readSettingsLink() {
  const hs = new URLSearchParams(location.hash.slice(1));
  if (!hs.get('server')) return false;
  const server = hs.get('server').trim().replace(/\/+$/, '');
  state.sync = {...state.sync, server, code: hs.has('code') ? hs.get('code') : state.sync.code, rev: state.sync.server === server ? state.sync.rev : 0, sig: state.sync.server === server ? state.sync.sig : null};
  save(); setLinkHash(server);
  return true;
}
// 다른 기기 연결 링크: 폰은 공유 창(카톡 등), 컴퓨터는 복사. 둘 다 안 되면 직접 복사할 수 있게 보여 줌
async function shareLink() {
  const url = linkFor(state.sync.server);
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({title: '역산 15분 플래너 연결', text: '이 링크를 열고 접속 코드만 넣으면 같은 계획이 들어와요.', url}); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('연결 링크를 복사했어요. 다른 기기에서 열고 접속 코드만 넣으세요.'); return; } catch {}
  openSheet(p => {
    const inp = h('input', {type: 'text', readonly: true, value: url, 'aria-label': '다른 기기 연결 링크', onfocus: e => e.target.select(),
      style: 'min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:10px 12px;width:100%;font-size:14px'});
    p.append(h('h2', {id: 'sheetTitle'}, '다른 기기 연결 링크'),
      h('p', {class: 'muted', style: 'margin:0'}, '이 주소를 다른 기기에서 열고 접속 코드만 넣으세요. 접속 코드는 링크에 들어 있지 않아요.'), inp,
      h('div', {class: 'row', style: 'justify-content:flex-end'}, h('button', {class: 'btn primary', type: 'button', onclick: closeSheet}, '닫기')));
    setTimeout(() => inp.select(), 40);
  });
}
addEventListener('hashchange', () => {
  if (!readSettingsLink()) return;
  syncEditing = !state.sync.code;
  go(state.sync.code ? tab : 'goals', state.sync.code ? null : 'syncCard');
  if (!state.sync.code) setTimeout(() => $('syncCode')?.focus({preventScroll: true}), 60);
  if (syncReady()) syncNow('link');
});

/* ---------- 앱으로 설치 ---------- */
let deferredPrompt;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('installBtn').hidden = false; });
$('installBtn').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('installBtn').hidden = true; };
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !(matchMedia('(display-mode: standalone)').matches || navigator.standalone)) $('iosHint').hidden = false;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname)))
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

const fromLink = readSettingsLink();
if (!fromLink && state.sync.server) setLinkHash(state.sync.server);   // 이미 연결된 기기: 지금 주소를 보내도 서버 칸이 채워지게
if (fromLink && !state.sync.code) { syncEditing = true; tab = 'goals'; document.querySelectorAll('.tabs button').forEach(b => b.dataset.tab === 'goals' ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')); for (const v of Object.keys(views)) $('view-' + v).hidden = v !== 'goals'; }
render();
if (state.timer) runTick();
if (fromLink && !state.sync.code) setTimeout(() => { $('syncCard')?.scrollIntoView({block: 'center'}); $('syncCode')?.focus({preventScroll: true}); }, 60);
if (syncReady()) syncNow('open');
// 만들던 목표가 있으면(다른 앱에 다녀오는 사이 앱이 닫혔을 때) 이어서
if (state.draft && state.draft.g) { wizard(state.draft); toast(state.draft.setup ? '설정하던 목표를 이어서 설정해요' : '만들던 목표를 이어서 만들어요'); }
</script>
